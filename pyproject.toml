[build-system]
requires = ["poetry>=1.5"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gaussian_random_field"
version = "0.0.3"
description = "DTC-IS module that fits a Gaussian random field to spatially distributed ice-sheet data, bringing variables of different resolution and sampling onto a shared grid with uncertainty."
authors = [
    "Amber Leeson <a.leeson@lancaster.ac.uk>",
    "DTC-IS consortium <support@dtc-ice-sheets.org>",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dtc-ice-sheets/gaussian_random_field"
packages = [{ include = "gaussian_random_field", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
numpy = "^2.3"
rpy2 = "^3.6.4"
xarray = "^2025.12.0"
zarr = "^3.1.2"
dask = { extras = ["array"], version = "^2026.8.0" }
shapely = "^2.1.2"
cyclopts = "^4.8.0"
rioxarray = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
typeguard = "^4.5.1"
pre-commit = "^4.5"
ruff = "^0.17.4"
bandit = "^1.9.3"
pytest-cov = "^7.0.0"
sphinx = "^9.1.0"
sphinx-rtd-theme = "^3.1.0"
sphinx-copybutton = "^0.5.2"
commitizen = "^4.12.1"
pydoclint = "^0.8.3"
pyproj = "^3.8.0"

[tool.poetry.group.deployment.dependencies]
dtc-wrapper = { git = "https://github.com/DTC-Ice-Sheets/dtc_wrapper.git", branch = "main" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "T20", # Disallow print statements
    "A",   # Ambiguity
    "ANN", # Annotations
    "B",   # Bad practices
    "C90", # Complexity
    "D",   # Documentation
    "E",   # Errors
    "F",   # Pyflakes (e.g. unused imports and vars)
    "G",   # logging formatting
    "I",   # Imports
    "N",   # Naming
    "Q",   # Quoting
    "W",   # Warnings
    "PT",  # pytest-style
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
    "BLE", # Blind except
    "RET", # Return statements
    "PTH", # Use pathlib
    "PD",  # Pandas
]

mccabe = { max-complexity = 10 }

ignore = [
    "D203", # One blank line required before class docstring (conflicts with D211)
    "D204", # One blank line required after class docstring
    "D205", # Docstring with no content
    "D212", # Multi-line docstring summary should start at the second line
    "D213", # Multi-line docstring summary should start at the first line
]

[tool.pydoclint]
style = 'numpy'
check_style_mismatch = "true"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "print",                            # Allow print statements in test files, as they are commonly used for debugging
    "module-import-not-at-top-of-file", # Allow 'import' statements not being at the top of the file (common in test files for clarity)
    "assert",                           # Allow the use of 'assert' statements in test files (common practice in pytest)
    "undocumented-public-function",     # Ignore missing docstring warnings for functions in test files (commonly not required for small test functions)
    "ANN",                              # Ignore missing type annotations for functions in test files (commonly not required for small test functions)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy" # Accepts: "google", "numpy", or "pep257"
[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.pytest.ini_options]
addopts = "--disable-warnings --cov gaussian_random_field --cov-fail-under=80"
typeguard-packages = """gaussian_random_field"""
typeguard-debug-instrumentation = true
typeguard-forward-ref-policy = "ERROR"
typeguard-collection-check-strategy = "ALL_ITEMS"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
